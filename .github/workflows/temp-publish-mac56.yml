name: Publish Mac build 56 (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download debug app zip
        run: |
          mkdir -p /tmp/macdl
          curl -fL -o /tmp/macdl/Blumoon-debug-app.zip "https://scaling-yodel-77w66w4g76vv3p9q6-8000.app.github.dev/Blumoon-debug-app.zip"
          echo "1df3fc7f5aa7550c594dcf0702dc7da5d68c78edace64db7e005e4522fdb3f02  /tmp/macdl/Blumoon-debug-app.zip" | sha256sum -c -
      - name: Publish to mac/
        run: |
          ls -la /tmp/macdl
          unzip -l /tmp/macdl/Blumoon-debug-app.zip | head -8
          mkdir -p mac
          cp /tmp/macdl/Blumoon-debug-app.zip mac/blumoon-mac-latest.zip
          SIZE=$(stat -c %s mac/blumoon-mac-latest.zip)
          printf '%s' "{\"run\": 56, \"url\": \"https://blumoon0304.github.io/ox-multi/mac/blumoon-mac-latest.zip\", \"size\": $SIZE}" > mac/blumoon-mac-version.json
          ls -la mac
          cat mac/blumoon-mac-version.json
          echo
          sha256sum mac/blumoon-mac-latest.zip
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mac/blumoon-mac-latest.zip mac/blumoon-mac-version.json
          git status --short
          git commit -m "Mac: publish debug build 56 for in-app updater"
          git push
