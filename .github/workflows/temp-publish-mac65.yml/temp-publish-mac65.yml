name: Publish Mac build 65 (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Mac build zip from codespace mirror
        run: |
          set -e
          curl -L -o /tmp/Blumoon-debug-app.zip "https://scaling-space-umbrella-5v5jj5pwvwjjfxjj-8000.app.github.dev/Blumoon-debug-app.zip"
          echo "f2ae9cd0e68c4d3e0479041caaf7ff77d37de3245da9dd9ae7b6fab526f542b1  /tmp/Blumoon-debug-app.zip" | sha256sum -c -
          ls -l /tmp/Blumoon-debug-app.zip
      - name: Publish to mac/
        run: |
          set -e
          cp /tmp/Blumoon-debug-app.zip mac/blumoon-mac-latest.zip
          SIZE=$(stat -c %s mac/blumoon-mac-latest.zip)
          printf '{"run": 65, "url": "https://blumoon0304.github.io/ox-multi/mac/blumoon-mac-latest.zip", "size": %s}' "$SIZE" > mac/blumoon-mac-version.json
          cat mac/blumoon-mac-version.json
      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mac/blumoon-mac-latest.zip mac/blumoon-mac-version.json
          git status --short
          git commit -m "Mac: publish debug build 65 for in-app updater"
          git push
