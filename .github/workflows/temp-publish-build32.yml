name: Publish build 32 to Pages (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with ox-2.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f ox-2.html ]; then echo "ox-2.html not found, nothing to do"; exit 0; fi
          git rm index.html
          git mv ox-2.html index.html
          git commit -m "Publish build 32 to Pages"
          git push
