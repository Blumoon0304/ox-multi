name: Publish Mac build 49 (temporary)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download debug app zip
        run: |
          mkdir -p /tmp/macdl
          curl -fL -o /tmp/macdl/Blumoon-debug-app.zip "https://tmpfiles.org/dl/1793955145.509ac3af7f646ece/w4ABJySetyH2/blumoon-debug-app.zip"
          echo "563d385ca354c8e5fcf304a425e9c1e5c028626dc2d302689a9043663d1635aa  /tmp/macdl/Blumoon-debug-app.zip" | sha256sum -c -
      - name: Publish to mac/
        run: |
          ls -la /tmp/macdl
          unzip -l /tmp/macdl/Blumoon-debug-app.zip | head -8
          mkdir -p mac
          cp /tmp/macdl/Blumoon-debug-app.zip mac/blumoon-mac-latest.zip
          SIZE=$(stat -c %s mac/blumoon-mac-latest.zip)
          printf '%s' "{\"run\": 49, \"url\": \"https://blumoon0304.github.io/ox-multi/mac/blumoon-mac-latest.zip\", \"size\": $SIZE}" > mac/blumoon-mac-version.json
          ls -la mac
          cat mac/blumoon-mac-version.json
          echo
          sha256sum mac/blumoon-mac-latest.zip
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mac/blumoon-mac-latest.zip mac/blumoon-mac-version.json
          git status --short
          git commit -m "Mac: publish debug build 49 for in-app updater"
          git push
